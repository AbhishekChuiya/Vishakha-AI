<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Accounts · Darpan{% endblock %}</title><style>
:root{color-scheme:light;font-family:Inter,Segoe UI,Arial,sans-serif}body{margin:0;min-height:100vh;background:#f4f7fb;color:#1b2940;display:grid;place-items:center}.panel{width:min(480px,calc(100% - 32px));background:white;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 18px 45px #10223b16;padding:28px;box-sizing:border-box}h1{margin:0 0 7px;font-size:23px}.sub{color:#66758a;margin:0 0 21px;font-size:14px;line-height:1.5}.account{padding:13px 0;display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eef0f4;align-items:center}.account strong{display:block}.account small{color:#728099}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer;background:#2563eb;color:white;text-decoration:none;display:inline-block;font-size:14px}.secondary{background:#eef3fa;color:#23344f}.remove{color:#b42318;background:none;border:0;cursor:pointer;font-size:13px;padding:8px}input{width:100%;padding:12px;border:1px solid #ced6e2;border-radius:9px;box-sizing:border-box;margin:6px 0 15px;font-size:15px}label{font-size:13px;font-weight:650}.links{margin-top:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.error{padding:12px;border-radius:10px;background:#fff1f1;color:#a21919;margin-bottom:12px}.notice{font-size:12px;color:#64748b;line-height:1.55;margin-top:15px}form{margin:0}</style></head><body><main class="panel">{% block content %}{% endblock %}</main></body></html>
