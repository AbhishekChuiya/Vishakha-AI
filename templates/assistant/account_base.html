<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Accounts · Darpan AI{% endblock %}</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#e4edff,transparent 36%),#f5f7fc;color:#1d2a41;display:flex;align-items:center;justify-content:center;padding:26px}
.panel{width:min(565px,100%);background:#fff;border:1px solid #e5eaf1;border-radius:24px;box-shadow:0 24px 70px #22365016;padding:32px}
.brand{font-size:12px;font-weight:850;letter-spacing:1.4px;color:#4067b6;margin:0 0 17px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0 0 8px;font-size:25px;letter-spacing:-.6px}.sub{color:#718096;font-size:13px;line-height:1.6;margin:0 0 24px}
.account{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #e8edf5;border-radius:15px;margin:10px 0;min-width:0;flex-wrap:wrap}
.avatar{display:grid;place-items:center;width:43px;height:43px;flex-shrink:0;background:#eaf1ff;color:#2e64b9;font-weight:750;border-radius:13px}
.account-details{flex:1;min-width:120px}.account-details strong{display:block;font-size:14px}.account-details small{display:block;color:#8390a3;font-size:11px;margin-top:4px;overflow-wrap:anywhere}
.current-pill{display:inline-block;margin-left:5px;padding:3px 7px;background:#e9f7f0;color:#12946e;font-size:10px;border-radius:20px}
.account-buttons{display:flex;gap:6px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#315fc5;color:white;text-decoration:none;display:inline-block;font-size:12px}.btn:hover{background:#244ca7}.btn.secondary{background:#eaf0f8;color:#254064}.btn.secondary:hover{background:#dce7f6}.btn.remove{background:#fff1f0;color:#ad322b}.btn.remove:hover{background:#ffe4e1}
input{width:100%;padding:12px;border:1px solid #d4ddec;border-radius:10px;margin:7px 0 18px;font-size:14px}label{font-size:13px;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.error{border-radius:12px;background:#fff0f0;color:#9c2323;padding:12px;margin:12px 0}.notice{border-top:1px solid #e9eef6;margin:25px 0 0;padding-top:14px;font-size:11px;color:#8390a3;line-height:1.6}form{margin:0}
@media(max-width:540px){.panel{padding:22px}.account-buttons{width:100%;justify-content:flex-end}}
</style></head><body><main class="panel"><div class="brand">✦ V I S H A K H A &nbsp; · &nbsp; D A R P A N &nbsp; A I</div>{% block content %}{% endblock %}</main></body></html>
