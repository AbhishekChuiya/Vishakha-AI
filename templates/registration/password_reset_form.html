{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Darpan AI - Forgot Password</title>

    <link
        rel="stylesheet"
        href="{% static 'css/login.css' %}"
    >

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- Brand -->

        <div class="login-brand">

            <div class="brand-icon">
                AI
            </div>

            <div>

                <h1>Darpan AI</h1>

                <p>
                    Employee Assistant
                </p>

            </div>

        </div>


        <!-- Heading -->

        <div class="login-heading">

            <h2>Forgot password?</h2>

            <p>
                Enter the email address associated with your
                Darpan AI account.
            </p>

        </div>


        <!-- Password Reset Form -->

        <form
            method="POST"
            class="login-form"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="id_email">
                    Email address
                </label>

                <input
                    id="id_email"
                    name="email"
                    type="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                    autofocus
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Send Reset Link
            </button>

        </form>


        <!-- Back to Login -->

        <div class="signup-link">

            Remember your password?

            <a href="/login/">
                Back to sign in
            </a>

        </div>

    </div>

</div>

</body>

</html>
