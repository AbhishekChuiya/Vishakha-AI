{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Darpan AI - Reset Email Sent</title>

    <link
        rel="stylesheet"
        href="{% static 'css/login.css' %}"
    >

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- Brand -->

        <div class="login-brand">

            <div class="brand-icon">
                AI
            </div>

            <div>

                <h1>Darpan AI</h1>

                <p>
                    Employee Assistant
                </p>

            </div>

        </div>


        <!-- Heading -->

        <div class="login-heading">

            <h2>Check your email</h2>

            <p>
                If an account exists with the email address
                you entered, we've sent password reset
                instructions.
            </p>

        </div>


        <div class="signup-link">

            Didn't receive the email?

            <a href="/accounts/password_reset/">
                Try again
            </a>

        </div>


        <div class="signup-link">

            <a href="/login/">
                Back to sign in
            </a>

        </div>

    </div>

</div>

</body>

</html>
